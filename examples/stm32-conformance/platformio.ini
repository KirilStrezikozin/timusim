[platformio]
default_envs = stm32_conformance

[env:stm32_conformance]
platform = ststm32
board = disco_l475vg_iot01a
framework = arduino
monitor_speed = 115200
lib_extra_dirs =
	../../lib
	../../external
lib_ignore =
	eigen
build_unflags =
	-mfloat-abi=soft
	-std=gnu++11
	-std=gnu++14
	-std=gnu++17
	-std=c++11
	-std=c++14
build_flags =
	-mfloat-abi=softfp
	-std=gnu++20
	-Wall
	-Wextra
	-Werror
	-Wno-error=vla
	-Wno-error=deprecated-declarations
	-DTARGET_PLATFORM=ARDUINO
	-DTARGET_PLATFORM_ARDUINO
	-DFUSION_USE_NORMAL_SQRT
	-I../../external/fusion/madgwick/include
	-I../../external/tl/include
	-I../../external/fmt/include
