[platformio]
default_envs = stm32_capture

[env]
platform = ststm32
board = disco_l475vg_iot01a
framework = arduino
monitor_speed = 921600
lib_extra_dirs =
	../../lib
	../../external
lib_ignore =
	eigen
extra_scripts = pre:platformio/fw_hash.py
build_unflags =
	-mfloat-abi=soft
	-std=gnu++11
	-std=gnu++14
	-std=gnu++17
	-std=c++11
	-std=c++14
build_flags =
	-mfloat-abi=softfp
	-std=gnu++20
	-Wall
	-Wextra
	-Werror
	-Wno-error=vla
	-Wno-error=deprecated-declarations
	-DTARGET_PLATFORM=ARDUINO
	-DTARGET_PLATFORM_ARDUINO
	-DFUSION_USE_NORMAL_SQRT
	-DSERIAL_TX_BUFFER_SIZE=4096
	-I../../external/fusion/madgwick/include
	-I../../external/tl/include
	-I../../external/fmt/include

; Palm LSM6DSL on the board, finger LSM9DS1.
[env:stm32_capture]

; V3/V4 rig: palm LSM6DSL, finger LSM9DS1 and palm_lsm9 LSM9DS1, all at default settings.
[env:rig]
build_flags =
	${env.build_flags}
	-DPALM_LSM9=1

; V5: palm LSM6DSL and the finger on the hand, the finger LSM9DS1 rewired with SDO_AG high (0x6B).
[env:v5]
build_flags =
	${env.build_flags}
	-DFINGER_SA0=LSM9DS1_SA0_HIGH

; V3: palm_lsm9 and one other sensor at their lowest ranges, the third at ±16 g and ±2000 dps.
[env:v3]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"v3\"
	-DPALM_LSM9=1
	-DFINGER_ACCEL_FS=LSM9DS1_2g
	-DFINGER_GYRO_FS=LSM9DS1_245dps
	-DPALM_ACCEL_FS=LSM6DSL_16g
	-DPALM_LSM9_ACCEL_FS=LSM9DS1_2g
	-DPALM_LSM9_GYRO_FS=LSM9DS1_245dps

[env:v3_board]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"v3_board\"
	-DPALM_LSM9=1
	-DFINGER_ACCEL_FS=LSM9DS1_16g
	-DPALM_ACCEL_FS=LSM6DSL_2g
	-DPALM_GYRO_FS=LSM6DSL_250dps
	-DPALM_LSM9_ACCEL_FS=LSM9DS1_2g
	-DPALM_LSM9_GYRO_FS=LSM9DS1_245dps

; palm_lsm9 sweep: the V1 finger settings on the second LSM9DS1, finger and palm at default.
[env:palm_lsm9_default]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lsm9_default\"
	-DPALM_LSM9=1
[env:palm_lsm9_low_range]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lsm9_low_range\"
	-DPALM_LSM9=1
	-DPALM_LSM9_ACCEL_FS=LSM9DS1_2g
	-DPALM_LSM9_GYRO_FS=LSM9DS1_245dps
[env:palm_lsm9_238hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lsm9_238hz\"
	-DPALM_LSM9=1
	-DPALM_LSM9_ODR=LSM9DS1_IMU_238Hz
[env:palm_lsm9_119hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lsm9_119hz\"
	-DPALM_LSM9=1
	-DPALM_LSM9_ODR=LSM9DS1_IMU_119Hz
[env:palm_lsm9_lpf2_strong]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lsm9_lpf2_strong\"
	-DPALM_LSM9=1
	-DPALM_LSM9_GYRO_OUT_PATH=LSM9DS1_LPF1_LPF2_OUT
	-DPALM_LSM9_GYRO_BW=LSM9DS1_LP_STRONG
[env:palm_lsm9_lpf2_light]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lsm9_lpf2_light\"
	-DPALM_LSM9=1
	-DPALM_LSM9_GYRO_OUT_PATH=LSM9DS1_LPF1_LPF2_OUT
	-DPALM_LSM9_GYRO_BW=LSM9DS1_LP_LIGHT
[env:palm_lsm9_952hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lsm9_952hz\"
	-DPALM_LSM9=1
	-DPALM_LSM9_ODR=LSM9DS1_IMU_952Hz
[env:palm_lsm9_mid_range]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lsm9_mid_range\"
	-DPALM_LSM9=1
	-DPALM_LSM9_ACCEL_FS=LSM9DS1_8g
	-DPALM_LSM9_GYRO_FS=LSM9DS1_500dps
[env:palm_lsm9_16g]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lsm9_16g\"
	-DPALM_LSM9=1
	-DPALM_LSM9_ACCEL_FS=LSM9DS1_16g
[env:palm_lsm9_xl_lp_off]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lsm9_xl_lp_off\"
	-DPALM_LSM9=1
	-DPALM_LSM9_ACCEL_BW=LSM9DS1_LP_DISABLE
[env:palm_lsm9_xl_div50]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lsm9_xl_div50\"
	-DPALM_LSM9=1
	-DPALM_LSM9_ACCEL_BW=LSM9DS1_LP_ODR_DIV_50

; V1 bench configs: one finger LSM9DS1 setting changed from the default per env.
; Gyro LPF2 cutoffs at 476 Hz from DS Table 47: STRONG 21 Hz, LIGHT 57 Hz.
[env:v1_low_range]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"low_range\"
	-DFINGER_ACCEL_FS=LSM9DS1_2g
	-DFINGER_GYRO_FS=LSM9DS1_245dps

[env:v1_238hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"238hz\"
	-DFINGER_ODR=LSM9DS1_IMU_238Hz

[env:v1_119hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"119hz\"
	-DFINGER_ODR=LSM9DS1_IMU_119Hz

[env:v1_lpf2_strong]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"lpf2_strong\"
	-DFINGER_GYRO_OUT_PATH=LSM9DS1_LPF1_LPF2_OUT
	-DFINGER_GYRO_BW=LSM9DS1_LP_STRONG

[env:v1_lpf2_light]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"lpf2_light\"
	-DFINGER_GYRO_OUT_PATH=LSM9DS1_LPF1_LPF2_OUT
	-DFINGER_GYRO_BW=LSM9DS1_LP_LIGHT

; Extra bench configs beyond the V1 list, for the chip model's range and filter parameters.
[env:v1x_952hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"952hz\"
	-DFINGER_ODR=LSM9DS1_IMU_952Hz

[env:v1x_mid_range]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"mid_range\"
	-DFINGER_ACCEL_FS=LSM9DS1_8g
	-DFINGER_GYRO_FS=LSM9DS1_500dps

[env:v1x_16g]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"16g\"
	-DFINGER_ACCEL_FS=LSM9DS1_16g

[env:v1x_xl_lp_off]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"xl_lp_off\"
	-DFINGER_ACCEL_BW=LSM9DS1_LP_DISABLE

[env:v1x_xl_div50]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"xl_div50\"
	-DFINGER_ACCEL_BW=LSM9DS1_LP_ODR_DIV_50

; Palm sweep: one palm LSM6DSL setting changed from the default per env, finger at default.
[env:palm_208hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_208hz\"
	-DPALM_ODR=208

[env:palm_833hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_833hz\"
	-DPALM_ODR=833

[env:palm_lp1_light]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lp1_light\"
	-DPALM_GYRO_BW=LSM6DSL_HP_DISABLE_LP1_LIGHT

[env:palm_lp1_aggressive]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_lp1_aggressive\"
	-DPALM_GYRO_BW=LSM6DSL_HP_DISABLE_LP1_AGGRESSIVE

[env:palm_xl_div50]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_xl_div50\"
	-DPALM_ACCEL_LP2=LSM6DSL_XL_LOW_LAT_LP_ODR_DIV_50

[env:palm_low_range]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"palm_low_range\"
	-DPALM_ACCEL_FS=LSM6DSL_2g
	-DPALM_GYRO_FS=LSM6DSL_250dps

; Pairs: one finger and one palm setting changed per env, to sweep both sensors in one capture.

[env:pair_952hz_208hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"952hz+palm_208hz\"
	-DFINGER_ODR=LSM9DS1_IMU_952Hz
	-DPALM_ODR=208

[env:pair_16g_833hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"16g+palm_833hz\"
	-DFINGER_ACCEL_FS=LSM9DS1_16g
	-DPALM_ODR=833

[env:pair_mid_range_lp1_light]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"mid_range+palm_lp1_light\"
	-DFINGER_ACCEL_FS=LSM9DS1_8g
	-DFINGER_GYRO_FS=LSM9DS1_500dps
	-DPALM_GYRO_BW=LSM6DSL_HP_DISABLE_LP1_LIGHT

[env:pair_xl_div50_lp1_aggressive]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"xl_div50+palm_lp1_aggressive\"
	-DFINGER_ACCEL_BW=LSM9DS1_LP_ODR_DIV_50
	-DPALM_GYRO_BW=LSM6DSL_HP_DISABLE_LP1_AGGRESSIVE

[env:pair_xl_lp_off_xl_div50]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"xl_lp_off+palm_xl_div50\"
	-DFINGER_ACCEL_BW=LSM9DS1_LP_DISABLE
	-DPALM_ACCEL_LP2=LSM6DSL_XL_LOW_LAT_LP_ODR_DIV_50

[env:pair_low_range_low_range]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"low_range+palm_low_range\"
	-DFINGER_ACCEL_FS=LSM9DS1_2g
	-DFINGER_GYRO_FS=LSM9DS1_245dps
	-DPALM_ACCEL_FS=LSM6DSL_2g
	-DPALM_GYRO_FS=LSM6DSL_250dps

[env:pair_119hz_208hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"119hz+palm_208hz\"
	-DFINGER_ODR=LSM9DS1_IMU_119Hz
	-DPALM_ODR=208

[env:pair_238hz_833hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"238hz+palm_833hz\"
	-DFINGER_ODR=LSM9DS1_IMU_238Hz
	-DPALM_ODR=833

[env:pair_lpf2_light_lp1_light]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"lpf2_light+palm_lp1_light\"
	-DFINGER_GYRO_OUT_PATH=LSM9DS1_LPF1_LPF2_OUT
	-DFINGER_GYRO_BW=LSM9DS1_LP_LIGHT
	-DPALM_GYRO_BW=LSM6DSL_HP_DISABLE_LP1_LIGHT

[env:pair_lpf2_strong_lp1_aggressive]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"lpf2_strong+palm_lp1_aggressive\"
	-DFINGER_GYRO_OUT_PATH=LSM9DS1_LPF1_LPF2_OUT
	-DFINGER_GYRO_BW=LSM9DS1_LP_STRONG
	-DPALM_GYRO_BW=LSM6DSL_HP_DISABLE_LP1_AGGRESSIVE

[env:pair_xl_div50_xl_div50]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"xl_div50+palm_xl_div50\"
	-DFINGER_ACCEL_BW=LSM9DS1_LP_ODR_DIV_50
	-DPALM_ACCEL_LP2=LSM6DSL_XL_LOW_LAT_LP_ODR_DIV_50

[env:pair_952hz_low_range]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"952hz+palm_low_range\"
	-DFINGER_ODR=LSM9DS1_IMU_952Hz
	-DPALM_ACCEL_FS=LSM6DSL_2g
	-DPALM_GYRO_FS=LSM6DSL_250dps

; Rig sweep: one LSM9DS1 setting on both finger and palm_lsm9 and one palm setting changed per env,
; to sweep all three sensors in one capture.

[env:trio_low_range_low_range]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"low_range+palm_low_range+palm_lsm9_low_range\"
	-DPALM_LSM9=1
	-DFINGER_ACCEL_FS=LSM9DS1_2g
	-DFINGER_GYRO_FS=LSM9DS1_245dps
	-DPALM_ACCEL_FS=LSM6DSL_2g
	-DPALM_GYRO_FS=LSM6DSL_250dps
	-DPALM_LSM9_ACCEL_FS=LSM9DS1_2g
	-DPALM_LSM9_GYRO_FS=LSM9DS1_245dps

[env:trio_238hz_833hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"238hz+palm_833hz+palm_lsm9_238hz\"
	-DPALM_LSM9=1
	-DFINGER_ODR=LSM9DS1_IMU_238Hz
	-DPALM_ODR=833
	-DPALM_LSM9_ODR=LSM9DS1_IMU_238Hz

[env:trio_119hz_208hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"119hz+palm_208hz+palm_lsm9_119hz\"
	-DPALM_LSM9=1
	-DFINGER_ODR=LSM9DS1_IMU_119Hz
	-DPALM_ODR=208
	-DPALM_LSM9_ODR=LSM9DS1_IMU_119Hz

[env:trio_lpf2_strong_lp1_aggressive]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"lpf2_strong+palm_lp1_aggressive+palm_lsm9_lpf2_strong\"
	-DPALM_LSM9=1
	-DFINGER_GYRO_OUT_PATH=LSM9DS1_LPF1_LPF2_OUT
	-DFINGER_GYRO_BW=LSM9DS1_LP_STRONG
	-DPALM_GYRO_BW=LSM6DSL_HP_DISABLE_LP1_AGGRESSIVE
	-DPALM_LSM9_GYRO_OUT_PATH=LSM9DS1_LPF1_LPF2_OUT
	-DPALM_LSM9_GYRO_BW=LSM9DS1_LP_STRONG

[env:trio_lpf2_light_lp1_light]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"lpf2_light+palm_lp1_light+palm_lsm9_lpf2_light\"
	-DPALM_LSM9=1
	-DFINGER_GYRO_OUT_PATH=LSM9DS1_LPF1_LPF2_OUT
	-DFINGER_GYRO_BW=LSM9DS1_LP_LIGHT
	-DPALM_GYRO_BW=LSM6DSL_HP_DISABLE_LP1_LIGHT
	-DPALM_LSM9_GYRO_OUT_PATH=LSM9DS1_LPF1_LPF2_OUT
	-DPALM_LSM9_GYRO_BW=LSM9DS1_LP_LIGHT

[env:trio_952hz_208hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"952hz+palm_208hz+palm_lsm9_952hz\"
	-DPALM_LSM9=1
	-DFINGER_ODR=LSM9DS1_IMU_952Hz
	-DPALM_ODR=208
	-DPALM_LSM9_ODR=LSM9DS1_IMU_952Hz

[env:trio_mid_range_lp1_light]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"mid_range+palm_lp1_light+palm_lsm9_mid_range\"
	-DPALM_LSM9=1
	-DFINGER_ACCEL_FS=LSM9DS1_8g
	-DFINGER_GYRO_FS=LSM9DS1_500dps
	-DPALM_GYRO_BW=LSM6DSL_HP_DISABLE_LP1_LIGHT
	-DPALM_LSM9_ACCEL_FS=LSM9DS1_8g
	-DPALM_LSM9_GYRO_FS=LSM9DS1_500dps

[env:trio_16g_833hz]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"16g+palm_833hz+palm_lsm9_16g\"
	-DPALM_LSM9=1
	-DFINGER_ACCEL_FS=LSM9DS1_16g
	-DPALM_ODR=833
	-DPALM_LSM9_ACCEL_FS=LSM9DS1_16g

[env:trio_xl_lp_off_xl_div50]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"xl_lp_off+palm_xl_div50+palm_lsm9_xl_lp_off\"
	-DPALM_LSM9=1
	-DFINGER_ACCEL_BW=LSM9DS1_LP_DISABLE
	-DPALM_ACCEL_LP2=LSM6DSL_XL_LOW_LAT_LP_ODR_DIV_50
	-DPALM_LSM9_ACCEL_BW=LSM9DS1_LP_DISABLE

[env:trio_xl_div50_lp1_aggressive]
build_flags =
	${env.build_flags}
	-DCAPTURE_CONFIG=\"xl_div50+palm_lp1_aggressive+palm_lsm9_xl_div50\"
	-DPALM_LSM9=1
	-DFINGER_ACCEL_BW=LSM9DS1_LP_ODR_DIV_50
	-DPALM_GYRO_BW=LSM6DSL_HP_DISABLE_LP1_AGGRESSIVE
	-DPALM_LSM9_ACCEL_BW=LSM9DS1_LP_ODR_DIV_50
