# Joint oscillator starting values. torque_density is fitted on V5 session 1 and K refitted
# there too, since postural muscle stiffness exceeds these passive values (Lakie et al. 2012).
#
# Wrist flexion: Lakie et al. 2012, J Physiol 590.11, model values (J, k, c, 120 ms muscle filter).
# Wrist deviation and forearm pronation-supination (sway_ry, the hand turned about the forearm
# axis at the wrist): Lakie's flexion values times Peaden & Charles 2014 (J Biomech 47, Table 2)
# ratios to flexion, the mean of their male and female ratios. Inertia: deviation I_Hx / I_Hz
# 1.123, pronation (I_Hy + I_Ay) / I_Hz 0.566; stiffness K_gg / K_bb 3.043, K_aa / K_bb 0.961;
# damping B_gg / B_bb 3.068, B_aa / B_bb 0.997. Their coupling terms are left out.
# Index finger: Tsakonas et al. 2023, Healthc Technol Lett, Table 1 means over 23 subjects
# (passive free response); their DIP values are not used, DIP follows PIP through dip_per_pip.
# The finger joints' 120 ms muscle filter is Lakie's wrist value, assumed until the fit.

[wrist_flex]
inertia = 0.0025
stiffness = 7.5
damping = 0.03
muscle_tau_s = 0.12
torque_density = 0.0

[wrist_dev]
inertia = 0.002808
stiffness = 22.82
damping = 0.0920
muscle_tau_s = 0.12
torque_density = 0.0

[sway_ry]
inertia = 0.001416
stiffness = 7.21
damping = 0.0299
muscle_tau_s = 0.12
torque_density = 0.0

