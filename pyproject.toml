[project]
name = "timusim"
version = "0.1.0"
description = "Simulated IMU data for a palm and finger chain, validated against real LSM9DS1 captures"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pyserial>=3.5",
    "scipy>=1.15",
    "tomli-w>=1.2",
]

[project.scripts]
timusim-capture = "timusim.cli:capture_main"
timusim-inspect = "timusim.cli:inspect_main"
timusim-bench = "timusim.cli:bench_main"
timusim-v1 = "timusim.cli:v1_main"
timusim-v2 = "timusim.cli:v2_main"
timusim-v3 = "timusim.cli:v3_main"
timusim-v4 = "timusim.cli:v4_main"
timusim-v5 = "timusim.cli:v5_main"
timusim-gyrocal = "timusim.cli:gyrocal_main"
timusim-compare = "timusim.cli:compare_main"
timusim-figures = "timusim.cli:figures_main"
timusim-protocol = "timusim.cli:protocol_main"
timusim-reproduce = "timusim.cli:reproduce_main"
timusim-place = "timusim.cli:place_main"

[dependency-groups]
dev = [
    "marimo>=0.20",
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
